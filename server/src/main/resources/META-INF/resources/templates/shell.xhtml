<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:p="http://primefaces.org/ui">
<h:head>
	<title><ui:insert name="title">#{msg['app.name']}</ui:insert></title>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<link rel="stylesheet" href="/webjars/primeflex/4.0.0/primeflex.min.css"/>
</h:head>
<h:body styleClass="ui-widget">
	<h:form id="appShell" styleClass="flex flex-column md:flex-row min-h-screen w-full m-0">
		<aside class="flex flex-column surface-section border-bottom-1 md:border-bottom-none md:border-right-1
			surface-border p-3 w-full md:w-16rem flex-none">
			<p:commandLink action="#{homeBean.goHome()}"
				update=":appShell:appNav :appShell:appContent" process="@this"
				title="#{msg['app.name']}"
				styleClass="flex align-items-center gap-2 mb-3 pb-3 border-bottom-1 surface-border
					no-underline text-color">
				<span class="flex align-items-center justify-content-center
					border-circle bg-primary text-white w-2rem h-2rem flex-none">
					<span class="pi pi-server" aria-hidden="true"></span>
				</span>
				<span class="text-lg font-medium line-height-2 m-0">#{msg['app.shortName']}</span>
			</p:commandLink>
			<h:panelGroup id="appNav" layout="block"
				styleClass="flex flex-row md:flex-column gap-2 flex-wrap md:flex-nowrap">
				<ui:insert name="nav"/>
			</h:panelGroup>
		</aside>

		<div class="flex flex-column flex-1 min-w-0">
			<ui:include src="/includes/app-topbar.xhtml"/>
			<main class="flex-1 surface-ground p-3 md:p-4">
				<h:panelGroup id="appContent" layout="block">
					<ui:insert name="content"/>
				</h:panelGroup>
			</main>
		</div>
	</h:form>
</h:body>
</html>
