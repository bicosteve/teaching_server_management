<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:p="http://primefaces.org/ui">
	<div class="mb-4">
		<div class="flex align-items-center justify-content-between gap-2 flex-wrap">
			<div class="min-w-0">
				<div class="text-lg font-medium line-height-2 m-0">#{title}</div>
				<div class="text-sm font-normal text-color-secondary line-height-2 m-0 mt-1">
					#{teacherCourseBean.selectedCourse.name()} · #{teacherCourseBean.selectedCourse.academicYear()}
				</div>
			</div>
			<span title="#{msg[teacherCourseBean.selectedCourse.statusTooltipKey()]}">
				<p:tag value="#{teacherCourseBean.selectedCourse.status()}"
					severity="#{teacherCourseBean.selectedCourse.statusSeverity()}"/>
			</span>
		</div>
	</div>
</ui:composition>
