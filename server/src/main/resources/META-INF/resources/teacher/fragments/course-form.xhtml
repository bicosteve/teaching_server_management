<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui">
	<ui:include src="/includes/page-header.xhtml">
		<ui:param name="title"
			value="#{teacherCourseBean.editMode ? msg['teacher.course.editTitle'] : msg['teacher.course.createTitle']}"/>
		<ui:param name="subtitle" value="#{msg['teacher.course.createSubtitle']}"/>
	</ui:include>

	<p:card styleClass="w-full">
		<h:inputHidden id="editId" value="#{teacherCourseBean.editId}"/>
		<p:messages id="courseMessages" showDetail="false" closable="true"/>
		<div class="flex flex-row align-items-end gap-3 mb-3">
			<div class="field ui-fluid flex-1 min-w-0 mb-0">
				<p:outputLabel for="courseName" value="#{msg['teacher.course.name']}"
					styleClass="text-sm font-normal"/>
				<p:inputText id="courseName" value="#{teacherCourseBean.name}"
					required="true" requiredMessage="#{msg['teacher.course.name.required']}" maxlength="200"/>
			</div>
			<div class="field ui-fluid w-12rem flex-none mb-0">
				<p:outputLabel for="academicYear" value="#{msg['teacher.course.academicYear']}"
					styleClass="text-sm font-normal"/>
				<p:selectOneMenu id="academicYear" value="#{teacherCourseBean.academicYear}"
					required="true" requiredMessage="#{msg['teacher.course.academicYear.required']}">
					<f:selectItems value="#{teacherCourseBean.academicYearOptions}"/>
				</p:selectOneMenu>
			</div>
			<div class="flex flex-nowrap gap-2 flex-none">
				<p:commandButton id="saveCourseButton"
					value="#{teacherCourseBean.editMode ? msg['teacher.course.save'] : msg['teacher.course.submit']}"
					icon="#{teacherCourseBean.editMode ? 'pi pi-check' : 'pi pi-plus'}"
					action="#{teacherCourseBean.saveCourse}"
					update=":appShell:appNav :appShell:appContent" process="@form"/>
				<p:commandButton value="#{msg['teacher.course.cancel']}"
					action="#{teacherCourseBean.cancelCourseForm}" icon="pi pi-times"
					update=":appShell:appNav :appShell:appContent" process="@this" immediate="true"
					styleClass="ui-button-outlined"/>
			</div>
		</div>
		<ui:include src="/teacher/fragments/course-description-editor.xhtml"/>
	</p:card>
</ui:composition>
