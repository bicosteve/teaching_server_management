<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:h="jakarta.faces.html"
	xmlns:p="http://primefaces.org/ui">
	<header class="flex flex-column md:flex-row md:align-items-center md:justify-content-between gap-3
		mb-4 pb-3 border-bottom-1 surface-border">
		<div class="flex align-items-center gap-2">
			<span class="flex align-items-center justify-content-center
				border-circle bg-primary text-white w-2rem h-2rem">
				<span class="pi pi-server" aria-hidden="true"></span>
			</span>
			<div class="flex flex-column">
				<span class="text-lg font-medium line-height-2 m-0">#{msg['app.name']}</span>
				<span class="text-sm font-normal text-color-secondary line-height-2 m-0">#{msg['home.subtitle']}</span>
			</div>
		</div>

		<div class="flex align-items-center justify-content-between md:justify-content-end gap-2">
			<div class="flex align-items-center gap-2 surface-ground border-round px-3 py-2">
				<span class="pi pi-user text-color-secondary" aria-hidden="true"></span>
				<span class="text-sm font-normal text-color-secondary white-space-nowrap m-0">#{homeBean.displayName()}</span>
				<p:tag value="#{homeBean.roleLabel()}" severity="info"/>
			</div>
			<h:form styleClass="m-0">
				<p:commandButton value="#{msg['home.signOut']}"
					action="#{homeBean.logout}"
					icon="pi pi-sign-out"
					styleClass="ui-button-outlined"
					ajax="false"
					process="@this"/>
			</h:form>
		</div>
	</header>
</ui:composition>
