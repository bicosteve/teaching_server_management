<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:p="http://primefaces.org/ui">
<ui:composition template="/templates/shell.xhtml">
	<ui:define name="title">#{msg['forbidden.title']}</ui:define>
	<ui:define name="nav">
		<ui:include src="#{homeBean.navFragment}"/>
	</ui:define>
	<ui:define name="content">
		<p:card>
			<div class="text-lg font-medium line-height-2 m-0">#{msg['forbidden.heading']}</div>
			<div class="text-sm font-normal text-color-secondary line-height-2 m-0 mt-1">#{msg['forbidden.subtitle']}</div>
			<p class="m-0 mt-3 text-sm font-normal text-color-secondary line-height-3">#{msg['forbidden.description']}</p>
		</p:card>
	</ui:define>
</ui:composition>
</html>
