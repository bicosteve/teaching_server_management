<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui">
<f:view>
<f:metadata>
	<f:event type="preRenderView" listener="#{loginBean.redirectIfAuthenticated}"/>
</f:metadata>
<h:head>
	<title>#{msg['login.title']}</title>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<link rel="stylesheet" href="/webjars/primeflex/4.0.0/primeflex.min.css"/>
</h:head>
<h:body styleClass="ui-widget">
	<div class="flex align-items-center justify-content-center min-h-screen surface-ground p-3">
		<p:card styleClass="w-full md:w-25rem">
			<div class="mb-4">
				<div class="text-lg font-medium line-height-2 m-0">#{msg['app.name']}</div>
				<div class="text-sm font-normal text-color-secondary line-height-2 m-0 mt-1">#{msg['login.subtitle']}</div>
			</div>

			<h:form id="loginForm" styleClass="ui-fluid">
				<p:messages id="messages" showDetail="false" closable="true"/>

				<div class="field">
					<p:outputLabel for="usernameOrEmail" value="#{msg['login.usernameOrEmail']}"
						styleClass="text-sm font-normal"/>
					<p:inputText id="usernameOrEmail"
						value="#{loginBean.usernameOrEmail}"
						required="true"
						requiredMessage="#{msg['login.usernameOrEmail.required']}"
						autocomplete="username"/>
				</div>

				<div class="field">
					<p:outputLabel for="password" value="#{msg['login.password']}"
						styleClass="text-sm font-normal"/>
					<p:password id="password"
						value="#{loginBean.password}"
						required="true"
						requiredMessage="#{msg['login.password.required']}"
						redisplay="false"
						toggleMask="true"
						autocomplete="current-password"/>
				</div>

				<p:commandButton id="loginButton"
					value="#{msg['login.submit']}"
					icon="pi pi-sign-in"
					action="#{loginBean.login}"
					ajax="false"
					process="@form"
					styleClass="w-full"/>
			</h:form>
		</p:card>
	</div>
</h:body>
</f:view>
</html>
