spring.application.name=teaching-server-management

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# HS256 secret must be at least 256 bits (32+ chars). Override via JWT_SECRET.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Jakarta Faces / PrimeFaces (JoinFaces)
joinfaces.faces.project-stage=development
joinfaces.faces.facelets-refresh-period=1
joinfaces.faces.automatic-extensionless-mapping=true
joinfaces.primefaces.theme=aura-light-emerald
joinfaces.primefaces.font-awesome=true
joinfaces.primefaces.prime-icons=true
joinfaces.primefaces.flex=true
