services:
  db:
    image: postgres:18-alpine
    container_name: tsm-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./server/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: tsm-server
    depends_on:
      db:
        condition: service_healthy
    environment:
      MODE: ${MODE}
      # In-container DNS name and Postgres listen port (not the host-mapped port).
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
    volumes:
      - ./server/src:/workspace/src
      - ./server/pom.xml:/workspace/pom.xml
      - ./server/scripts:/workspace/scripts:ro
      - ./server/docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - maven_cache:/root/.m2
    ports:
      - "${SERVER_PORT}:8080"

volumes:
  postgres_data:
  maven_cache:
